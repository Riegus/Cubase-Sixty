<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cubase-Sixty Settings</title>
<link rel="icon" id="favicon" href="data:,">
<style>
  :root {
    --bg: #f4f4f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #dcdcd6;
    --accent: #2f7d4f; --accent-ink: #ffffff; --warn: #b26a00; --bad: #b3261e; --rail: #ebebe6; --focus: #2f7d4f55;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --panel: #1f1f1d; --ink: #ecece6; --muted: #9a9a92; --line: #33332f;
      --accent: #5cc285; --accent-ink: #0d1f14; --warn: #f0b429; --bad: #ff6b5e; --rail: #1a1a18; --focus: #5cc28566;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 "Segoe UI", system-ui, sans-serif; }
  .app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  nav { background: var(--rail); border-right: 1px solid var(--line); padding: 20px 12px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 18px; font-weight: 600; letter-spacing: .2px; }
  .brand svg { flex: none; }
  nav a { display: block; padding: 8px 10px; border-radius: 6px; color: var(--ink); text-decoration: none; }
  nav a:hover { background: var(--line); }
  nav a.on { background: var(--accent); color: var(--accent-ink); }
  main { padding: 28px 36px 60px; max-width: 860px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 24px; }
  section { display: none; }
  section.on { display: block; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; margin-bottom: 16px; }
  .card h2 { font-size: 16px; margin: 0 0 4px; }
  .help { color: var(--muted); margin: 0 0 12px; font-size: 14px; }
  .when { font-size: 12px; color: var(--warn); margin-left: 6px; }
  label.choice { display: flex; gap: 10px; align-items: flex-start; padding: 7px 8px; border-radius: 6px; cursor: pointer; }
  label.choice:hover { background: var(--bg); }
  label.choice input { margin-top: 3px; accent-color: var(--accent); }
  .def { color: var(--muted); font-size: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 4px; }
  .row label.choice { border: 1px solid var(--line); padding: 6px 12px; align-items: center; }
  .row label.choice input { margin-top: 0; }
  .dev { display: grid; grid-template-columns: 90px 1fr; gap: 6px 12px; align-items: center; }
  .pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 13px; border: 1px solid var(--line); }
  .pill.ok { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .pill.warn { color: var(--warn); border-color: var(--warn); }
  .pill.bad { color: var(--bad); border-color: var(--bad); }
  .favs { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .slot { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  .slot span { width: 18px; color: var(--muted); font-size: 13px; text-align: right; }
  .slot input { flex: 1; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; }
  .slot button { padding: 4px 8px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 7px 14px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  input:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
  code { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 13px; }
  #toast { position: fixed; right: 20px; bottom: 20px; background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.on { opacity: .95; }
  #toast.bad { background: var(--bad); color: #fff; }
  .search { padding: 0 2px 12px; }
  .search input { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); font: inherit; font-size: 14px; }
  .search input:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
  .filter { display: flex; gap: 6px; align-items: center; margin: 0 0 16px; flex-wrap: wrap; }
  .filter .lbl { color: var(--muted); font-size: 14px; margin-right: 4px; }
  .filter button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .surf { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .3px; padding: 0 6px; margin-left: 8px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); vertical-align: 2px; }
  .sec-tag { font-size: 12px; color: var(--muted); font-weight: normal; display: block; margin-bottom: 2px; }
  mark { background: #f5d76e; color: #1d1d1b; border-radius: 2px; padding: 0 1px; }
  .gone { padding: 40px; text-align: center; color: var(--muted); }
  @media (max-width: 700px) { .app { grid-template-columns: 1fr; } nav { border-right: 0; border-bottom: 1px solid var(--line); } main { padding: 20px 16px; } .favs { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="app">
  <nav>
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 16 16" aria-hidden="true"><rect x="0.5" y="1" width="15" height="14" rx="2.5" fill="var(--accent)"/><g fill="#1e1e1e"><rect x="3.9" y="3.5" width="1.2" height="9" rx=".6"/><rect x="7.4" y="3.5" width="1.2" height="9" rx=".6"/><rect x="10.9" y="3.5" width="1.2" height="9" rx=".6"/></g><g fill="#fff"><rect x="2.9" y="8.4" width="3.2" height="2.2" rx=".5"/><rect x="6.4" y="3.9" width="3.2" height="2.2" rx=".5"/><rect x="9.9" y="6.4" width="3.2" height="2.2" rx=".5"/></g></svg>
      Cubase-Sixty
    </div>
    <div class="search"><input id="q" type="search" placeholder="Search settings  ( / )" aria-label="Search settings" autocomplete="off"></div>
    <div id="rail"></div>
  </nav>
  <main id="main">
    <div class="gone">Loading…</div>
  </main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
const TOKEN = "__TOKEN__";
const sections = [
  { id: "devices", title: "Devices", lead: "The surfaces the bridge has found, Cubase, and how bright the surfaces are." },
  { id: "behaviour", title: "Behaviour", lead: "How the surfaces step through tracks and what they start on." },
  { id: "uf1keys", title: "UF1 soft keys", lead: "What the four keys under the UF1's display do in the DAW and SENDS views." },
  { id: "uc1keys", title: "UC1 keys", lead: "What the UC1's magnifier, 360 and secondary encoder push keys do." },
  { id: "uc1strip", title: "UC1 on Cubase's strip", lead: "How the UC1 works a track that has no SSL channel strip: Cubase's own channel strip (gate, compressor, EQ) and the Bus Comp section." },
  { id: "display", title: "Display", lead: "What the surfaces' displays show." },
  { id: "favourites", title: "Favourites", lead: "The channel strips and bus comps the CS Fav / BC Fav modes step through (UF8 CHANNEL encoder, UC1 secondary encoder)." },
  { id: "logging", title: "Logging", lead: "What is written to the log files." },
  { id: "about", title: "About", lead: "" },
];
let state = null;
let current = (location.hash || "#devices").slice(1);

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for (const k of kids) if (k != null) e.append(k instanceof Node ? k : document.createTextNode(k));
  return e;
}
function toast(text, bad) {
  const t = document.getElementById("toast");
  t.textContent = text; t.className = "on" + (bad ? " bad" : "");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = "", 2200);
}
async function post(path, fields) {
  const body = new URLSearchParams({ token: TOKEN, ...fields });
  const r = await fetch(path, { method: "POST", body });
  const j = await r.json().catch(() => ({ ok: false, error: "no answer" }));
  if (!j.ok) throw new Error(j.error || "failed");
}
async function load() {
  try {
    const r = await fetch("/api/state?token=" + TOKEN);
    if (!r.ok) throw new Error();
    state = await r.json();
    render();
    setFavicon(statusLevel(state.status));
  } catch {
    setFavicon(0);
    document.getElementById("main").innerHTML = '<div class="gone">The bridge is not answering. Is it running? (Tray icon: Restart bridge, then open Settings again.)</div>';
  }
}

function pill(text) {
  const cls = /connected|project open/.test(text) ? "ok" : /unplugged|not found|no project|waiting/.test(text) ? "warn" : "bad";
  return el("span", { class: "pill " + cls }, text);
}

function settingCard(d) {
  const card = el("div", { class: "card" },
    el("h2", {}, d.label, d.live ? null : el("span", { class: "when" }, "takes effect when Cubase starts again")),
    el("p", { class: "help" }, d.help));
  // Short choices (brightness steps, on / off) side by side; longer ones one per line.
  const box = el("div", { class: d.choices.every(c => c.label.length <= 10) ? "row" : "" });
  card.append(box);
  for (const c of d.choices) {
    const id = d.key + "-" + c.value;
    const input = el("input", { type: "radio", name: d.key, id, value: c.value });
    input.checked = d.value === c.value;
    input.addEventListener("change", async () => {
      try { await post("/api/set", { key: d.key, value: c.value }); d.value = c.value; toast("Saved"); }
      catch (e) { toast("Not saved: " + e.message, true); load(); }
    });
    box.append(el("label", { class: "choice", for: id }, input,
      el("span", {}, c.label, c.value === d.def ? el("span", { class: "def" }, "  (default)") : null)));
  }
  return card;
}

function favouriteColumn(title, key, names, known) {
  const listId = "known-" + key;
  const col = el("div", { class: "card" }, el("h2", {}, title),
    el("p", { class: "help" }, "Up to eight, in the order the encoder steps through them. Type a plug-in's name as Cubase's plug-in list shows it."));
  const dl = el("datalist", { id: listId });
  for (const k of known) dl.append(el("option", { value: k }));
  col.append(dl);
  const inputs = [];
  for (let i = 0; i < 8; i++) {
    const inp = el("input", { type: "text", list: listId, "aria-label": title + " " + (i + 1) });
    inp.value = names[i] || "";
    inputs.push(inp);
    const move = (dir) => {
      const j = i + dir; if (j < 0 || j > 7) return;
      [inputs[i].value, inputs[j].value] = [inputs[j].value, inputs[i].value];
    };
    col.append(el("div", { class: "slot" }, el("span", {}, String(i + 1)), inp,
      el("button", { type: "button", title: "Move up", "aria-label": "Move up", onclick: () => move(-1) }, "↑"),
      el("button", { type: "button", title: "Move down", "aria-label": "Move down", onclick: () => move(1) }, "↓")));
  }
  col.inputs = inputs;
  return col;
}

function fillStatus(card) {
  const st = state.status || {};
  card.innerHTML = "";
  for (const [name, v] of [["UF8", st.uf8], ["UF1", st.uf1], ["UC1", st.uc1], ["Cubase", st.cubase]])
    card.append(el("strong", {}, name), el("div", {}, pill(v || "unknown")));
}

function sectionBody(id) {
  const s = el("div");
  if (id === "devices") {
    const card = el("div", { class: "card dev", id: "status" });
    fillStatus(card);
    s.append(card, el("p", { class: "help" }, "Surfaces can be plugged in and out while everything runs; the bridge looks for a missing one every two seconds."));
    for (const d of state.settings.filter(d => d.section === "Devices")) s.append(settingCard(d));
  } else if (id === "favourites") {
    const f = state.favourites;
    const strips = favouriteColumn("Channel strips (CS Fav)", "strips", f.strips, f.knownStrips);
    const buses = favouriteColumn("Bus comps (BC Fav)", "bus", f.busComps, f.knownBusComps);
    const save = el("button", { class: "primary", type: "button", onclick: async () => {
      try {
        await post("/api/favourites", { strips: strips.inputs.map(i => i.value).join("\n"), busComps: buses.inputs.map(i => i.value).join("\n") });
        toast("Favourites saved");
        load();
      } catch (e) { toast("Not saved: " + e.message, true); }
    } }, "Save favourites");
    s.append(el("div", { class: "favs" }, strips, buses), save);
  } else if (id === "about") {
    s.append(el("div", { class: "card" },
      el("h2", {}, "Cubase-Sixty " + (state.version || "")),
      el("p", { class: "help" }, "SSL UF8, UF1 and UC1 in Cubase, ported from Rea-Sixty. Free, open-source software, provided \"as is\" without warranty."),
      el("p", { class: "help" }, "Not made, endorsed or supported by Solid State Logic or Steinberg. SSL, UF8, UF1, UC1 and SSL 360 are trademarks of Solid State Logic; Cubase is a trademark of Steinberg Media Technologies."),
      el("p", { class: "help" }, "Logs: ", el("code", {}, state.paths.logs)),
      el("p", { class: "help" }, "This page is served by the bridge on this computer only. The settings are kept in ", el("code", {}, "settings.txt"), " and ", el("code", {}, "favourites.txt"), " in ", el("code", {}, state.paths.settings || ""), "; editing those by hand works too.")));
  } else if (id === "behaviour") {
    // Which surfaces' behaviour to show (several at once); remembered in this browser.
    const all = ["UF8", "UF1", "UC1"];
    let shown = all.slice();
    try { const v = JSON.parse(localStorage.getItem("cs-behaviour-surfaces")); if (Array.isArray(v)) shown = v.filter(x => all.includes(x)); } catch (e) {}
    const list = el("div");
    const bar = el("div", { class: "filter", role: "group", "aria-label": "Surfaces" }, el("span", { class: "lbl" }, "Show:"));
    const fill = () => {
      list.innerHTML = "";
      const ds = state.settings.filter(d => d.section === "Behaviour")
        .map(d => ({ d, s: surfacesOf(d) }))
        .filter(x => x.s.some(s => shown.includes(s)));
      ds.sort((a, b) => order(a.s) - order(b.s));   // the ones for all surfaces first, then UF8, UF1, UC1
      for (const x of ds) {
        const card = settingCard(x.d);
        const h = card.querySelector("h2");
        for (const s of x.s.length === 3 ? ["All surfaces"] : x.s) h.append(el("span", { class: "surf" }, s));
        list.append(card);
      }
      if (!ds.length) list.append(el("div", { class: "gone" }, shown.length ? "Nothing for these surfaces." : "Pick one or more surfaces above."));
    };
    const order = s => s.length === 3 ? 0 : 1 + Math.min(...s.map(x => all.indexOf(x)));
    for (const name of all) {
      const b = el("button", { type: "button", "aria-pressed": String(shown.includes(name)) }, name);
      b.addEventListener("click", () => {
        shown = shown.includes(name) ? shown.filter(x => x !== name) : all.filter(x => x === name || shown.includes(x));
        b.setAttribute("aria-pressed", String(shown.includes(name)));
        try { localStorage.setItem("cs-behaviour-surfaces", JSON.stringify(shown)); } catch (e) {}
        fill();
      });
      bar.append(b);
    }
    s.append(bar, list);
    fill();
  } else {
    const title = sections.find(x => x.id === id).title;
    for (const d of state.settings.filter(d => d.section === title)) s.append(settingCard(d));
  }
  return s;
}

// The surfaces a setting is for: those its key or name names (UF8, UF1, UC1); none named = all three.
function surfacesOf(d) {
  const t = (d.key + " " + d.label).toUpperCase();
  const s = ["UF8", "UF1", "UC1"].filter(x => t.includes(x));
  return s.length ? s : ["UF8", "UF1", "UC1"];
}

// Search: every setting whose name, help, choices or section has the words, from all sections, with the words marked.
function query() { const q = document.getElementById("q"); return q ? q.value.trim() : ""; }
function markIn(node, q) {
  const lq = q.toLowerCase(), w = document.createTreeWalker(node, NodeFilter.SHOW_TEXT), hits = [];
  for (let t = w.nextNode(); t; t = w.nextNode()) if (t.nodeValue.toLowerCase().includes(lq)) hits.push(t);
  for (const t of hits) {
    const s = t.nodeValue, ls = s.toLowerCase(), frag = document.createDocumentFragment();
    let at = 0, i;
    while ((i = ls.indexOf(lq, at)) >= 0) { frag.append(s.slice(at, i), el("mark", {}, s.slice(i, i + q.length))); at = i + q.length; }
    frag.append(s.slice(at));
    t.replaceWith(frag);
  }
}
function renderSearch(main, q) {
  const lq = q.toLowerCase(), has = t => String(t || "").toLowerCase().includes(lq);
  main.append(el("h1", {}, "Search"), el("p", { class: "lead" }, "Settings matching “" + q + "”. Escape clears the search."));
  let n = 0;
  for (const sec of sections) {
    const own = state.settings.filter(d => d.section === sec.title || (sec.id === "devices" && d.section === "Devices"));
    const hits = own.filter(d => has(d.label) || has(d.help) || has(d.section) || has(sec.title) || d.choices.some(c => has(c.label)));
    for (const d of hits) {
      const card = settingCard(d);
      card.querySelector("h2").prepend(el("span", { class: "sec-tag" }, sec.title));
      markIn(card, q);
      main.append(card); ++n;
    }
    if (!own.length && (has(sec.title) || has(sec.lead))) {   // Favourites, About: the section itself
      const card = el("div", { class: "card" }, el("h2", {}, el("span", { class: "sec-tag" }, "Section"), sec.title),
        el("p", { class: "help" }, sec.lead || ""), el("a", { href: "#" + sec.id, onclick: () => { document.getElementById("q").value = ""; current = sec.id; setTimeout(render); } }, "Open " + sec.title));
      markIn(card, q);
      main.append(card); ++n;
    }
  }
  if (!n) main.append(el("div", { class: "gone" }, "Nothing found."));
}

function render() {
  const rail = document.getElementById("rail");
  rail.innerHTML = "";
  const q = query();
  for (const sec of sections)
    rail.append(el("a", { href: "#" + sec.id, class: sec.id === current && q.length < 2 ? "on" : "", onclick: () => { document.getElementById("q").value = ""; current = sec.id; setTimeout(render); } }, sec.title));
  const main = document.getElementById("main");
  main.innerHTML = "";
  if (q.length >= 2) { renderSearch(main, q); return; }
  const sec = sections.find(x => x.id === current) || sections[0];
  main.append(el("h1", {}, sec.title));
  if (sec.lead) main.append(el("p", { class: "lead" }, sec.lead));   // (append(null) would show "null")
  main.append(sectionBody(sec.id));
}

window.addEventListener("hashchange", () => { current = (location.hash || "#devices").slice(1); render(); });
{
  const box = document.getElementById("q");
  let timer = 0;
  box.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(() => { if (state) render(); }, 150); });
  box.addEventListener("keydown", e => { if (e.key === "Escape") { box.value = ""; if (state) render(); } });
  window.addEventListener("keydown", e => {
    if (e.key === "/" && document.activeElement !== box && !(document.activeElement && document.activeElement.tagName === "INPUT")) { e.preventDefault(); box.focus(); box.select(); }
  });
}
// The Devices status follows along while the page is open.
// The tab's icon: the tray icon's mixing surface in the same colours (green: a project open, yellow: the bridge
// runs but Cubase has no project / has not spoken yet, red: the bridge does not answer).
function setFavicon(level) {
  const fill = ["#dc322f", "#f0b41e", "#3cbe50"][level];
  const rim = ["#6e1918", "#785a0f", "#1e5f28"][level];
  const slots = [[4.5, 9.5], [8, 5], [11.5, 7.5]].map(([x, y]) =>
    `<rect x="${x - 0.6}" y="3.5" width="1.2" height="9" rx="0.6" fill="#1f1f1f"/>` +
    `<rect x="${x - 1.6}" y="${y - 1.1}" width="3.2" height="2.2" rx="0.5" fill="#fff"/>`).join("");
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><rect x="0.5" y="1" width="15" height="14" rx="2.5" fill="${rim}"/>` +
    `<rect x="1.5" y="2" width="13" height="12" rx="1.8" fill="${fill}"/>${slots}</svg>`;
  document.getElementById("favicon").href = "data:image/svg+xml," + encodeURIComponent(svg);
}
function statusLevel(st) { return st && st.cubase === "project open" ? 2 : 1; }
setFavicon(1);
// The status follows along while the page is open: the tab's icon always, the Devices card when it shows (only the
// card is redrawn, so the settings below it keep their focus).
setInterval(async () => {
  try {
    const r = await fetch("/api/state?token=" + TOKEN);
    if (!r.ok) { setFavicon(0); return; }
    state.status = (await r.json()).status;
    setFavicon(statusLevel(state.status));
    if (current !== "devices") return;
    const card = document.getElementById("status");
    if (card) fillStatus(card);
  } catch { setFavicon(0); }
}, 2000);
load();
</script>
</body>
</html>
